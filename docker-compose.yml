services:
  pokeapimicrodex:
    image: pokeapimicrodex
    build:
      context: .
      dockerfile: PokeAPIMicroDex/Dockerfile
    ports:
      - "5279:5279"
    environment:
      - RedisConnection=redis-service:6379
      - ASPNETCORE_URLS="http://0.0.0.0:5279"
    depends_on:
      - redis-service
    network_mode: host
    restart: 'unless-stopped'

  redis-service:
    image: redis:latest
    ports:
      - "6379:6379"

    
